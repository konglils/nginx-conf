user www-data; # worker 用户，设置为专用用户保证安全
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types; # 加载常见文件类型对应的 MIME
    default_type application/octet-stream; # 设置默认 MIME

    # json 格式的日志，方便其他程序解析，可以输入给 jq 美观输出
    log_format main escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"host":"$host",'
        '"server_port":$server_port,'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent",'
        '"x_forwarded_for":"$http_x_forwarded_for"'
    '}';

    access_log  /var/log/nginx/access.json.log  main;

    # 隐藏各种报错页面和 Header 里的 Nginx 版本号
    server_tokens off;

    # 对于普通的 HTTP 服务器，这三个选项直接全开
    sendfile    on; # 适合静态文件多的情况
    tcp_nopush  on; # 不使用 PUSH
    tcp_nodelay on; # 禁用 Nagle 算法

    keepalive_timeout  65;   # 保持 TCP 连接的时长
    keepalive_requests 2000; # 一次 TCP 连接最多发送多少 HTTP 请求

    http2 on; # 全站开启 HTTP/2 支持

    # TLS 相关选项
    # 参考 Mozilla SSL 配置生成器（见解释），不同 Nginx 版本和 OpenSSL 版本的配置有所差异
    ssl_protocols TLSv1.2 TLSv1.3; # 使用 TLS 1.2 和 TLS 1.3（禁用更早的不安全版本）
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off; # 上面的加密套件都是安全的，可以由客户端选择最高效的

    # TLS 会话复用，减少服务器开销和 TLS 握手时间
    ssl_session_timeout 1d; # 最大会话复用时间
    ssl_session_cache shared:MozSSL:10m; # 大约 40000 个会话

    # 把会话信息加密成 ticket 发给客户端，减小服务端压力
    # 为了安全，在负载不高的情况下，最好关闭
    ssl_session_tickets off;

    # 服务端缓存证书验证状态，发给客户端，减少客户端验证证书的时间
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 223.5.5.5 223.6.6.6; # OCSP 需要 DNS

    # 强制使用 HTTPS，非 HTTPS 请求重定向为 HTTPS
    server {
        # default_server 显式指定默认服务器
        # reuseport 允许多个进程绑定到同一个 socket，能大幅提升性能
        listen 80 default_server reuseport;
        listen [::]:80 default_server reuseport; # 监听 IPv6
        return 308 https://$host$request_uri;
    }

    # 关闭主机名不匹配的 HTTPS 请求
    server {
        # HTTP/1.1 and HTTP/2 (TCP)
        listen 443 ssl default_server reuseport;
        listen [::]:443 ssl default_server reuseport;
        # HTTP/3 (QUIC, UDP)
        listen 443 quic default_server reuseport;
        listen [::]:443 quic default_server reuseport;
        # 通过 SNI 检测到主机名不匹配的时候直接关闭连接，拒绝 TLS 握手
        ssl_reject_handshake on;
    }

    include /etc/nginx/conf.d/*.conf; # 加载其他配置
}
